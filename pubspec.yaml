name: el_fadaly_gallery
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.2.0
  cloud_firestore: ^6.0.2
  cached_network_image: ^3.4.1
  photo_view: ^0.15.0
  google_fonts: ^6.3.2
  font_awesome_flutter: ^10.9.0
  url_launcher: ^6.3.2
  http: ^1.5.0
  share_plus: ^10.1.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/logo.jpg

flutter_icons:
  android: true
  ios: true
  image_path: "assets/logo.jpg"
  web:
    generate: true
    image_path: "assets/logo.jpg"
